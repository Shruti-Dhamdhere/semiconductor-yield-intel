name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric==2.5.0
          pip install black flake8 isort pytest pytest-cov
          pip install pandas numpy scikit-learn xgboost lightgbm shap mlflow pydantic fastapi loguru

      - name: Check Python syntax
        run: python -m py_compile src/data/loader.py src/models/baseline.py src/api/main.py && echo "Syntax OK" 

      - name: Run tests
        run: pytest tests/ -v --cov=src
