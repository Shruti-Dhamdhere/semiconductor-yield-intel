name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric==2.5.0
          pip install black flake8 isort pytest pytest-cov
          pip install pandas numpy scikit-learn xgboost lightgbm shap mlflow pydantic fastapi loguru

      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=120 --ignore=E203,W503,E501,E302,E402,F401,E221,E241,E305

      - name: Run tests
        run: pytest tests/ -v --cov=src
